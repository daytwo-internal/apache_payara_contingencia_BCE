---
- name: Ejecutar start-deployment-group para cada grupo
  ansible.builtin.command: >
    {{ asadmin_base_cmd }} start-deployment-group
    --timeout={{ dg_action_timeout }}
    --instanceTimeout={{ dg_action_instance_timeout }}
    {{ item }}
  loop: "{{ dg_list }}"
  register: start_results
  changed_when: true
  failed_when: false

- name: Mostrar resultado crudo del start si hubo error
  ansible.builtin.debug:
    msg: "{{ item.item }} -> rc={{ item.rc }} : {{ item.stdout | default('') }} {{ item.stderr | default('') }}"
  loop: "{{ start_results.results }}"
  when: item.rc != 0

- name: Identificar DG que no se pudieron iniciar
  ansible.builtin.set_fact:
    dg_fallidos: >-
      {{ start_results.results
         | selectattr('rc', 'ne', 0)
         | map(attribute='item')
         | list }}

- name: Publicar hechos del resultado final start con DG
  ansible.builtin.set_fact:
    payara_final_state: >-
      DG procesados: {{ dg_list }}.
      {{ 'Todos iniciados correctamente.' if dg_fallidos | length == 0
         else 'Fallaron: ' ~ (dg_fallidos | join(', ')) }}
    payara_dg_procesados: "{{ dg_list }}"
    payara_ok: "{{ dg_fallidos | length == 0 }}"
    payara_instancias_fallidas: "{{ dg_fallidos }}"
    payara_das_action: "{{ 'START-DOMAIN' if (manage_das | default(false) | bool) else 'NO ADMINISTRADO' }}"
    payara_das_ok: true
    payara_topologia: "DEPLOYMENT_GROUPS"
