# Acciones permitidas para payara_action
valid_payara_actions:
  - status
  - stop
  - start

# Si el rol debe administrar el DAS (start-domain/stop-domain) en este host.
# En hosts con Deployment Groups normalmente será true solo en el nodo
# que aloja el DAS; en hosts standalone depende de si ese host tiene su
# propio DAS.
manage_das: false

# Si se descubre automáticamente la lista de Deployment Groups vía
# "asadmin list-deployment-groups". Si se pone en false, se debe definir
# manualmente la variable dg_list en group_vars/host_vars.
dg_autodiscover: true

# Reintentos/espera genéricos para operaciones de arranque/parada
check_retries: 30
check_delay: 10

# Puerto de correo por defecto (host/to/from se definen por entorno)
mail_port: 25

dg_target: []

dg_action_timeout: 200
dg_action_instance_timeout: 200


# Timeout de seguridad (segundos) para el comando "start-domain" en sí:
# si asadmin se cuelga (no que tarde, que nunca regrese), "timeout" del SO
# lo mata a esos segundos en vez de dejar el job colgado indefinidamente.
das_start_command_timeout: 300
 
# Timeout de seguridad (segundos) por CADA llamada individual de
# "list-domains" dentro del loop de espera. check_retries/check_delay ya
# limitan el total acumulado, pero no protegen una llamada puntual que se
# cuelgue — esto sí.
das_check_command_timeout: 30
