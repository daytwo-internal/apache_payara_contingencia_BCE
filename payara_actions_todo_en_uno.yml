---
# Uso:
#   Solo consultar estado:
#     ansible-playbook -i inventory.ini payara_deployment_groups.yml -e "payara_action=status"
#
#   Bajar:
#     - Si el host tiene Deployment Groups: baja DG/instancias y luego baja DAS si manage_das=true.
#     - Si el host NO tiene Deployment Groups: baja solo el DAS si manage_das=true.
#     ansible-playbook -i inventory.ini payara_deployment_groups.yml -e "payara_action=stop"
#
#   Subir:
#     - Si manage_das=true: levanta primero el DAS.
#     - Si el host tiene Deployment Groups: luego levanta los DG/instancias.
#     - Si el host NO tiene Deployment Groups: solo levanta el DAS.
#     ansible-playbook -i inventory.ini payara_deployment_groups.yml -e "payara_action=start"

- name: Gestionar Payara con Deployment Groups o Standalone, DAS opcional y correo
  hosts: das
  become: false
  gather_facts: false

  vars_prompt:
    - name: payara_action
      prompt: "Acción a ejecutar (status/stop/start)"
      default: "status"
      private: false

    - name: payara_admin_pass
      prompt: "Password del admin de asadmin"
      private: true

  vars:
    asadmin_path: "{{ as_home }}/bin/asadmin"

    asadmin_base_cmd: >-
      {{ asadmin_path }}
      --host {{ das_host }}
      --port {{ das_port }}
      {{ '--secure=true' if das_secure else '' }}
      --user {{ admin_user }}
      --passwordfile {{ pwd_tmp.path }}

  pre_tasks:
    - name: Validar que payara_action tiene un valor permitido
      ansible.builtin.assert:
        that:
          - payara_action is defined
          - payara_action in valid_payara_actions
        fail_msg: >
          payara_action='{{ payara_action | default('') }}' no es válido.
          Valores permitidos: {{ valid_payara_actions | join(', ') }}
      run_once: true

    - name: Leer AS_HOME real en el host
      ansible.builtin.shell: bash -lc 'echo $AS_HOME'
      register: remote_as_home
      changed_when: false

    - name: Verificar que AS_HOME remoto coincide con group_vars
      ansible.builtin.assert:
        that:
          - (remote_as_home.stdout | trim) == as_home
        fail_msg: >
          En {{ inventory_hostname }} el AS_HOME real es
          '{{ remote_as_home.stdout | trim }}' pero group_vars tiene
          configurado '{{ as_home }}'.

    - name: Confirmar que asadmin existe
      ansible.builtin.stat:
        path: "{{ asadmin_path }}"
      register: st_asadmin

    - name: Fallar si no existe asadmin
      ansible.builtin.assert:
        that:
          - st_asadmin.stat.exists
        fail_msg: "No se encontró asadmin en {{ asadmin_path }} en {{ inventory_hostname }}"

    - name: Crear archivo temporal para password de asadmin
      ansible.builtin.tempfile:
        state: file
        suffix: asadmin
      register: pwd_tmp

    - name: Escribir password de admin en archivo temporal
      ansible.builtin.copy:
        dest: "{{ pwd_tmp.path }}"
        content: "AS_ADMIN_PASSWORD={{ payara_admin_pass }}\n"
        mode: "0600"
      no_log: true

    # ---------------------------------------------------------------
    # START: si manage_das=true, primero levantar el DAS.
    # Aplica para servidores con DG y standalone.
    # ---------------------------------------------------------------
    - name: Levantar DAS antes de cualquier start
      ansible.builtin.command: "{{ asadmin_path }} start-domain {{ payara_domain }}"
      when:
        - payara_action == 'start'
        - manage_das | default(false) | bool
      register: start_das_result
      changed_when: true
      failed_when: false

    - name: Mostrar resultado crudo del start-domain si hubo error
      ansible.builtin.debug:
        msg: "start-domain rc={{ start_das_result.rc }} stdout={{ start_das_result.stdout | default('') }} stderr={{ start_das_result.stderr | default('') }}"
      when:
        - payara_action == 'start'
        - manage_das | default(false) | bool
        - start_das_result is defined
        - start_das_result.rc != 0

    - name: Esperar a que el DAS responda por asadmin
      ansible.builtin.command: "{{ asadmin_base_cmd }} list-domains"
      register: das_status_check
      until: das_status_check.rc == 0
      retries: "{{ das_check_retries | default(check_retries) }}"
      delay: "{{ das_check_delay | default(check_delay) }}"
      changed_when: false
      when:
        - payara_action == 'start'
        - manage_das | default(false) | bool

    - name: Descubrir automáticamente Deployment Groups
      ansible.builtin.command: "{{ asadmin_base_cmd }} list-deployment-groups"
      register: list_dg_raw
      changed_when: false
      when: dg_autodiscover | default(true) | bool

    - name: Publicar lista de Deployment Groups descubiertos
      ansible.builtin.set_fact:
        dg_list: >-
          {{ list_dg_raw.stdout_lines
             | map('trim')
             | reject('equalto', '')
             | reject('match', '^Command ')
             | reject('match', '^List of Deployment Groups:')
             | reject('search', 'No Deployment Group has been created')
             | list }}
      when: dg_autodiscover | default(true) | bool

    - name: Normalizar dg_list si no existe
      ansible.builtin.set_fact:
        dg_list: "{{ dg_list | default([]) }}"

    - name: Detectar si este host tiene Deployment Groups
      ansible.builtin.set_fact:
        payara_has_dg: "{{ dg_list | length > 0 }}"

    - name: Mostrar topología detectada
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} -> payara_has_dg={{ payara_has_dg }},
          dg_list={{ dg_list }}

  tasks:
    - name: BLOQUE PRINCIPAL con limpieza garantizada
      block:

        # ---------------------------------------------------------------
        # 0. STATUS
        # ---------------------------------------------------------------
        - name: BLOQUE - Solo consultar estado
          when: payara_action == 'status'
          block:
            - name: Consultar estado actual de instancias
              ansible.builtin.command: "{{ asadmin_base_cmd }} list-instances --long=true"
              register: list_status
              changed_when: false
              failed_when: false

            - name: Consultar estado de dominios
              ansible.builtin.command: "{{ asadmin_base_cmd }} list-domains"
              register: list_domains_status
              changed_when: false
              failed_when: false

            - name: Publicar hechos de estado actual
              ansible.builtin.set_fact:
                payara_final_state: |
                  ESTADO DOMINIOS:
                  {{ list_domains_status.stdout | default('SIN DATOS') }}

                  ESTADO INSTANCIAS:
                  {{ list_status.stdout | default('SIN DATOS') }}
                payara_dg_procesados: "{{ dg_list }}"
                payara_ok: true
                payara_instancias_fallidas: []
                payara_das_action: "STATUS"
                payara_das_ok: true
                payara_topologia: "{{ 'DEPLOYMENT_GROUPS' if payara_has_dg | bool else 'STANDALONE/SIN_DG' }}"

        # ---------------------------------------------------------------
        # 1A. STOP Deployment Groups si existen
        # ---------------------------------------------------------------
        - name: BLOQUE - Detener Deployment Groups
          when:
            - payara_action == 'stop'
            - payara_has_dg | bool
          block:
            - name: Ejecutar stop-deployment-group para cada grupo
              ansible.builtin.command: >
                {{ asadmin_base_cmd }} stop-deployment-group {{ item }}
              loop: "{{ dg_list }}"
              register: stop_results
              changed_when: true
              failed_when: false

            - name: Mostrar resultado crudo del stop si hubo error
              ansible.builtin.debug:
                msg: "{{ item.item }} -> rc={{ item.rc }} : {{ item.stdout | default('') }} {{ item.stderr | default('') }}"
              loop: "{{ stop_results.results }}"
              when: item.rc != 0

            - name: Esperar a que todas las instancias queden detenidas
              ansible.builtin.shell: >
                {{ asadmin_base_cmd }} list-instances --long=true
                | grep -E "^instancia|^instance"
                | grep -vci "not running"
              register: still_running
              until: still_running.stdout | trim == "0"
              retries: "{{ check_retries }}"
              delay: "{{ check_delay }}"
              changed_when: false
              ignore_errors: true

            - name: Obtener listado tras intento normal de stop
              ansible.builtin.command: "{{ asadmin_base_cmd }} list-instances --long=true"
              register: list_normal
              changed_when: false

            - name: Identificar instancias que siguen corriendo
              ansible.builtin.set_fact:
                instancias_pendientes: >-
                  {{ list_normal.stdout_lines
                     | select('match', '^(instancia|instance)')
                     | reject('search', 'not running')
                     | map('regex_replace', '^([^ \t]+).*', '\1')
                     | list }}

            - name: ESCALAR - Forzar stop-instance individual
              ansible.builtin.command: >
                {{ asadmin_base_cmd }} stop-instance --kill=true {{ item }}
              loop: "{{ instancias_pendientes }}"
              when: instancias_pendientes | length > 0
              register: force_stop_results
              changed_when: true
              failed_when: false

            - name: Pausa breve para reflejar stop forzado
              ansible.builtin.wait_for:
                timeout: 10
              delegate_to: localhost
              when: instancias_pendientes | length > 0

            - name: Reobtener listado tras stop forzado
              ansible.builtin.command: "{{ asadmin_base_cmd }} list-instances --long=true"
              register: list_final
              changed_when: false

            - name: Recalcular instancias que todavía siguen corriendo
              ansible.builtin.set_fact:
                instancias_fallidas: >-
                  {{ list_final.stdout_lines
                     | select('match', '^(instancia|instance)')
                     | reject('search', 'not running')
                     | map('regex_replace', '^([^ \t]+).*', '\1')
                     | list }}

            - name: Detener DAS después de detener todas las instancias
              ansible.builtin.command: "{{ asadmin_path }} stop-domain {{ payara_domain }}"
              when:
                - manage_das | default(false) | bool
                - instancias_fallidas | length == 0
              register: stop_das_result
              changed_when: true
              failed_when: false

            - name: Publicar hechos del resultado final stop con DG
              ansible.builtin.set_fact:
                payara_final_state: "{{ list_final.stdout }}"
                payara_dg_procesados: "{{ dg_list }}"
                payara_ok: "{{ instancias_fallidas | length == 0 and ((not (manage_das | default(false) | bool)) or (stop_das_result is defined and stop_das_result.rc == 0)) }}"
                payara_instancias_fallidas: "{{ instancias_fallidas }}"
                payara_das_action: "{{ 'STOP-DOMAIN' if (manage_das | default(false) | bool) else 'NO ADMINISTRADO' }}"
                payara_das_ok: "{{ (not (manage_das | default(false) | bool)) or (stop_das_result is defined and stop_das_result.rc == 0) }}"
                payara_topologia: "DEPLOYMENT_GROUPS"

        # ---------------------------------------------------------------
        # 1B. STOP standalone / sin Deployment Groups
        # ---------------------------------------------------------------
        - name: BLOQUE - Detener servidor standalone sin Deployment Groups
          when:
            - payara_action == 'stop'
            - not (payara_has_dg | bool)
          block:
            - name: Detener DAS standalone
              ansible.builtin.command: "{{ asadmin_path }} stop-domain {{ payara_domain }}"
              when: manage_das | default(false) | bool
              register: stop_das_result
              changed_when: true
              failed_when: false

            - name: Marcar standalone como no administrado si manage_das=false
              ansible.builtin.debug:
                msg: "Host sin Deployment Groups y manage_das=false: no se detiene el DAS."
              when: not (manage_das | default(false) | bool)

            - name: Publicar hechos del resultado final stop standalone
              ansible.builtin.set_fact:
                payara_final_state: >-
                  Host sin Deployment Groups. {{
                  'Se ejecutó stop-domain sobre ' ~ payara_domain
                  if (manage_das | default(false) | bool)
                  else 'No se tocó el DAS porque manage_das=false.'
                  }}
                payara_dg_procesados: []
                payara_ok: "{{ (not (manage_das | default(false) | bool)) or (stop_das_result is defined and stop_das_result.rc == 0) }}"
                payara_instancias_fallidas: []
                payara_das_action: "{{ 'STOP-DOMAIN' if (manage_das | default(false) | bool) else 'NO ADMINISTRADO' }}"
                payara_das_ok: "{{ (not (manage_das | default(false) | bool)) or (stop_das_result is defined and stop_das_result.rc == 0) }}"
                payara_topologia: "STANDALONE/SIN_DG"

        # ---------------------------------------------------------------
        # 2A. START Deployment Groups si existen
        # El DAS ya se levantó en pre_tasks si manage_das=true
        # ---------------------------------------------------------------
        - name: BLOQUE - Iniciar Deployment Groups
          when:
            - payara_action == 'start'
            - payara_has_dg | bool
          block:
            - name: Ejecutar start-deployment-group para cada grupo
              ansible.builtin.command: >
                {{ asadmin_base_cmd }} start-deployment-group {{ item }}
              loop: "{{ dg_list }}"
              register: start_results
              changed_when: true
              failed_when: false

            - name: Mostrar resultado crudo del start si hubo error
              ansible.builtin.debug:
                msg: "{{ item.item }} -> rc={{ item.rc }} : {{ item.stdout | default('') }} {{ item.stderr | default('') }}"
              loop: "{{ start_results.results }}"
              when: item.rc != 0

            - name: Esperar a que todas las instancias queden corriendo
              ansible.builtin.shell: >
                {{ asadmin_base_cmd }} list-instances --long=true
                | grep -E "^instancia|^instance"
                | grep -ci "not running"
              register: not_running_count
              until: not_running_count.stdout | trim == "0"
              retries: "{{ check_retries }}"
              delay: "{{ check_delay }}"
              changed_when: false
              ignore_errors: true

            - name: Obtener listado tras intento normal de start
              ansible.builtin.command: "{{ asadmin_base_cmd }} list-instances --long=true"
              register: list_normal
              changed_when: false

            - name: Identificar instancias que siguen sin levantar
              ansible.builtin.set_fact:
                instancias_pendientes: >-
                  {{ list_normal.stdout_lines
                     | select('match', '^(instancia|instance)')
                     | select('search', 'not running')
                     | map('regex_replace', '^([^ \t]+).*', '\1')
                     | list }}

            - name: ESCALAR - Reintentar start-instance individual
              ansible.builtin.command: >
                {{ asadmin_base_cmd }} start-instance {{ item }}
              loop: "{{ instancias_pendientes }}"
              when: instancias_pendientes | length > 0
              register: force_start_results
              changed_when: true
              failed_when: false

            - name: Pausa breve para reflejar start
              ansible.builtin.wait_for:
                timeout: 10
              delegate_to: localhost
              when: instancias_pendientes | length > 0

            - name: Reobtener listado tras reintento de start
              ansible.builtin.command: "{{ asadmin_base_cmd }} list-instances --long=true"
              register: list_final
              changed_when: false

            - name: Recalcular instancias que todavía no levantaron
              ansible.builtin.set_fact:
                instancias_fallidas: >-
                  {{ list_final.stdout_lines
                     | select('match', '^(instancia|instance)')
                     | select('search', 'not running')
                     | map('regex_replace', '^([^ \t]+).*', '\1')
                     | list }}

            - name: Publicar hechos del resultado final start con DG
              ansible.builtin.set_fact:
                payara_final_state: "{{ list_final.stdout }}"
                payara_dg_procesados: "{{ dg_list }}"
                payara_ok: "{{ instancias_fallidas | length == 0 }}"
                payara_instancias_fallidas: "{{ instancias_fallidas }}"
                payara_das_action: "{{ 'START-DOMAIN' if (manage_das | default(false) | bool) else 'NO ADMINISTRADO' }}"
                payara_das_ok: true
                payara_topologia: "DEPLOYMENT_GROUPS"

        # ---------------------------------------------------------------
        # 2B. START standalone / sin Deployment Groups
        # ---------------------------------------------------------------
        - name: BLOQUE - Iniciar servidor standalone sin Deployment Groups
          when:
            - payara_action == 'start'
            - not (payara_has_dg | bool)
          block:
            - name: Consultar dominios luego del start standalone
              ansible.builtin.command: "{{ asadmin_base_cmd }} list-domains"
              register: list_domains_after_start
              changed_when: false
              failed_when: false
              when: manage_das | default(false) | bool

            - name: Publicar hechos del resultado final start standalone
              ansible.builtin.set_fact:
                payara_final_state: >-
                  Host sin Deployment Groups. {{
                  list_domains_after_start.stdout | default('No se tocó el DAS porque manage_das=false.')
                  }}
                payara_dg_procesados: []
                payara_ok: "{{ (not (manage_das | default(false) | bool)) or (list_domains_after_start is defined and list_domains_after_start.rc == 0) }}"
                payara_instancias_fallidas: []
                payara_das_action: "{{ 'START-DOMAIN' if (manage_das | default(false) | bool) else 'NO ADMINISTRADO' }}"
                payara_das_ok: "{{ (not (manage_das | default(false) | bool)) or (list_domains_after_start is defined and list_domains_after_start.rc == 0) }}"
                payara_topologia: "STANDALONE/SIN_DG"

      always:
        - name: Borrar password temporal del disco
          ansible.builtin.file:
            path: "{{ pwd_tmp.path }}"
            state: absent
          when: pwd_tmp is defined and pwd_tmp.path is defined

  post_tasks:
    - name: Calcular si todos los hosts terminaron bien
      ansible.builtin.set_fact:
        payara_todo_ok: "{{ ansible_play_hosts | map('extract', hostvars, 'payara_ok') | select('sameas', false) | list | length == 0 }}"
      run_once: true
      delegate_to: localhost

    - name: Enviar correo con resultado
      community.general.mail:
        host: "{{ mail_host }}"
        port: "{{ mail_port }}"
        to: "{{ mail_to }}"
        from: "{{ mail_from }}"
        subject: >-
          {{ '[Payara] Estado actual reportado (consulta, sin cambios)'
             if payara_action == 'status'
             else ('[Payara] OK - Acción '
                   ~ payara_action
                   ~ ' ejecutada correctamente'
                   if (payara_todo_ok | bool)
                   else '[Payara] ALERTA - Problemas ejecutando acción ' ~ payara_action) }}
        body: |
          Acción ejecutada: {{ payara_action }}
          manage_das: {{ manage_das | default(false) }}
          Dominio Payara: {{ payara_domain | default('NO DEFINIDO') }}
          Resultado global: {{ 'OK' if (payara_todo_ok | bool) else 'CON PROBLEMAS - revisar' }}

          {% for h in ansible_play_hosts %}
          ==== {{ h }} ({{ hostvars[h].as_home }}) ====
          Topología detectada: {{ hostvars[h].payara_topologia | default('SIN DATOS') }}
          Deployment Groups procesados: {{ hostvars[h].payara_dg_procesados | default([]) | join(', ') }}
          Acción DAS: {{ hostvars[h].payara_das_action | default('SIN DATOS') }}
          DAS OK: {{ hostvars[h].payara_das_ok | default('SIN DATOS') }}
          Estado: {{ 'OK' if (hostvars[h].payara_ok | default(false) | bool) else 'FALLIDO' }}

          {% if not (hostvars[h].payara_ok | default(false) | bool) %}
          Instancias que quedaron mal en {{ h }}:
          {{ hostvars[h].payara_instancias_fallidas | default([]) | join(', ') }}
          {% endif %}

          Estado final:
          {{ hostvars[h].payara_final_state | default('SIN DATOS - revisar manualmente') }}

          {% endfor %}
      delegate_to: localhost
      run_once: true

    - name: Terminar con error real si algún host quedó mal
      ansible.builtin.fail:
        msg: >
          Una o más acciones no quedaron en el estado esperado.
          Revisa el correo enviado a {{ mail_to }}.
      when: not (payara_todo_ok | bool)
      run_once: true