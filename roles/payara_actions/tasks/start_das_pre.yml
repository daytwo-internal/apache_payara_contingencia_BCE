---
- name: Levantar DAS antes de cualquier start (con timeout de seguridad)
  ansible.builtin.command: >-
    timeout {{ das_start_command_timeout | default(300) }}
    {{ asadmin_path }} start-domain {{ payara_domain }}
  register: start_das_result
  changed_when: true
  failed_when: false

- name: Mostrar resultado crudo del start-domain si hubo error
  ansible.builtin.debug:
    msg: >-
      start-domain rc={{ start_das_result.rc }}
      {{ '(TIMEOUT: superó ' ~ (das_start_command_timeout | default(300)) ~ 's sin responder)'
         if start_das_result.rc == 124 else '' }}
      stdout={{ start_das_result.stdout | default('') }}
      stderr={{ start_das_result.stderr | default('') }}
  when: start_das_result.rc != 0

- name: Esperar a que el DAS reporte el dominio corriendo (chequeo local, sin autenticar)
  ansible.builtin.command: >-
    timeout {{ das_check_command_timeout | default(30) }}
    {{ asadmin_path }} list-domains
  register: das_status_check
  until:
    - das_status_check.rc == 0
    - "'not running' not in das_status_check.stdout"
  retries: "{{ das_check_retries | default(check_retries) }}"
  delay: "{{ das_check_delay | default(check_delay) }}"
  changed_when: false