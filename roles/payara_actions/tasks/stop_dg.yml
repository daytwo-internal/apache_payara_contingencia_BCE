---
- name: Ejecutar stop-deployment-group para cada grupo (con escalamiento nativo a kill)
  ansible.builtin.command: >
    {{ asadmin_base_cmd }} stop-deployment-group
    --kill=true
    --timeout={{ dg_action_timeout }}
    --instanceTimeout={{ dg_action_instance_timeout }}
    {{ item }}
  loop: "{{ dg_list }}"
  register: stop_results
  changed_when: true
  failed_when: false

- name: Mostrar resultado crudo del stop si hubo error
  ansible.builtin.debug:
    msg: "{{ item.item }} -> rc={{ item.rc }} : {{ item.stdout | default('') }} {{ item.stderr | default('') }}"
  loop: "{{ stop_results.results }}"
  when: item.rc != 0

- name: Identificar DG que no se pudieron detener
  ansible.builtin.set_fact:
    dg_fallidos: >-
      {{ stop_results.results
         | selectattr('rc', 'ne', 0)
         | map(attribute='item')
         | list }}

- name: Detener DAS después de detener los DG solicitados
  ansible.builtin.command: "{{ asadmin_path }} stop-domain {{ payara_domain }}"
  when:
    - manage_das | default(false) | bool
    - dg_fallidos | length == 0
  register: stop_das_result
  changed_when: true
  failed_when: false

- name: Publicar hechos del resultado final stop con DG
  ansible.builtin.set_fact:
    payara_final_state: >-
      DG procesados: {{ dg_list }}.
      {{ 'Todos detenidos correctamente.' if dg_fallidos | length == 0
         else 'Fallaron: ' ~ (dg_fallidos | join(', ')) }}
    payara_dg_procesados: "{{ dg_list }}"
    payara_ok: "{{ dg_fallidos | length == 0 and ((not (manage_das | default(false) | bool)) or (stop_das_result is defined and stop_das_result.rc == 0)) }}"
    payara_instancias_fallidas: "{{ dg_fallidos }}"
    payara_das_action: "{{ 'STOP-DOMAIN' if (manage_das | default(false) | bool) else 'NO ADMINISTRADO' }}"
    payara_das_ok: "{{ (not (manage_das | default(false) | bool)) or (stop_das_result is defined and stop_das_result.rc == 0) }}"
    payara_topologia: "DEPLOYMENT_GROUPS"
