- name: Verificar si existe la linea activa de 172.20.40.36
  shell: grep -c "^172.20.40.36.*bceqasep1" /etc/hosts
  register: linea_activa_qto
  failed_when: false
  changed_when: false

- name: Verificar si existe la linea activa de 172.17.10.113
  shell: grep -c "^172.17.10.113.*bceqasep1" /etc/hosts
  register: linea_activa_gye
  failed_when: false
  changed_when: false

# ─── QUITO: activar 172.20.40.36 y comentar 172.17.10.113 ───────────────────
- name: Descomentar linea "172.20.40.36" (nodo Quito)
  replace:
    path: /etc/hosts
    regexp: '^#{1,}\s*(172\.20\.40\.36\s+bceqasep1.*)'
    replace: '\1'
  when:
    - ciudad | lower == "quito"
    - linea_activa_qto.stdout | int == 0

- name: Comentar linea "172.17.10.113" (nodo Guayaquil) cuando ciudad es Quito
  replace:
    path: /etc/hosts
    regexp: '^(172\.17\.10\.113\s+bceqasep1.*)'
    replace: '#\1'
  when:
    - ciudad | lower == "quito"
    - linea_activa_gye.stdout | int > 0

# ─── GUAYAQUIL: activar 172.17.10.113 y comentar 172.20.40.36 ───────────────
- name: Descomentar linea "172.17.10.113" (nodo Guayaquil)
  replace:
    path: /etc/hosts
    regexp: '^#{1,}\s*(172\.17\.10\.113\s+bceqasep1.*)'
    replace: '\1'
  when:
    - ciudad | lower == "guayaquil"
    - linea_activa_gye.stdout | int == 0

- name: Comentar linea "172.20.40.36" (nodo Quito) cuando ciudad es Guayaquil
  replace:
    path: /etc/hosts
    regexp: '^(172\.20\.40\.36\s+bceqasep1.*)'
    replace: '#\1'
  when:
    - ciudad | lower == "guayaquil"
    - linea_activa_qto.stdout | int > 0

# ─── Verificación final ──────────────────────────────────────────────────────
- name: Verificar resultado final
  shell: grep "bceqasep1" /etc/hosts
  register: resultado
  changed_when: false

- name: Mostrar estado final
  debug:
    msg: "{{ resultado.stdout_lines }}"